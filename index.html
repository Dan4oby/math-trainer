<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: умножение и деление</title>
<style>
  :root {
    --green: #16a34a;
    --green-light: #dcfce7;
    --red: #dc2626;
    --red-light: #fee2e2;
    --ink: #1e293b;
    --accent: #4f46e5;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #e0f2fe 50%, #f0fdf4 100%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ---------- экраны ---------- */
  .screen { display: none; width: 100%; max-width: 760px; }
  .screen.active { display: block; animation: fadeIn .35s ease both; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- стартовый экран ---------- */
  .start-card {
    background: #fff;
    border-radius: 26px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 22px 50px -24px rgba(30,41,59,.45);
  }
  h1 { font-size: clamp(26px, 6vw, 38px); margin: 0 0 10px; }
  .subtitle { color: #64748b; font-size: 17px; margin: 0 0 26px; }

  .rules { list-style: none; padding: 0; margin: 0 0 30px; display: grid; gap: 12px; }
  .rules li {
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    padding: 14px 18px;
    font-weight: 600;
    font-size: 16px;
    text-align: left;
  }
  .rules li b { color: var(--accent); }

  /* ---------- кнопки ---------- */
  .btn {
    border: none;
    border-radius: 14px;
    padding: 13px 26px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #e2e8f0;
    color: var(--ink);
    transition: transform .12s ease, background .2s, box-shadow .2s, opacity .2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 12px 26px -12px var(--accent);
  }
  .btn:disabled { opacity: .45; cursor: default; }

  /* ---------- верхняя панель ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: 16px;
    color: #475569;
    gap: 10px;
  }
  .phase {
    background: #fff;
    padding: 7px 16px;
    border-radius: 999px;
    color: var(--accent);
    box-shadow: 0 8px 20px -12px rgba(30,41,59,.5);
  }
  .progressbar {
    height: 10px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin: 14px 0 26px;
  }
  .progressbar-fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #6366f1, #22c55e);
    transition: width .45s cubic-bezier(.22,1,.36,1);
  }

  /* ---------- карточка с примером ---------- */
  .card {
    background: #fff;
    border-radius: 26px;
    padding: 34px 24px 30px;
    text-align: center;
    border: 3px solid transparent;
    box-shadow: 0 22px 50px -24px rgba(30,41,59,.45);
    transition: border-color .25s, background .25s, box-shadow .25s;
  }
  .card.correct {
    border-color: var(--green);
    background: linear-gradient(180deg, #ffffff 40%, var(--green-light));
    box-shadow: 0 0 0 6px rgba(34,197,94,.15), 0 22px 50px -24px rgba(30,41,59,.45);
    animation: correctPop .5s ease;
  }
  .card.wrong {
    border-color: var(--red);
    background: linear-gradient(180deg, #ffffff 40%, var(--red-light));
    box-shadow: 0 0 0 6px rgba(239,68,68,.15), 0 22px 50px -24px rgba(30,41,59,.45);
    animation: shake .5s ease;
  }

  @keyframes correctPop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.035); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-13px); }
    32% { transform: translateX(11px); }
    50% { transform: translateX(-8px); }
    68% { transform: translateX(6px); }
    85% { transform: translateX(-3px); }
  }

  .example {
    font-size: clamp(44px, 12vw, 78px);
    font-weight: 800;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    margin: 4px 0 28px;
    line-height: 1.1;
    user-select: none;
  }

  .answer-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  /* контейнер, внутри которого app.js строит поля ответа */
  .answer-fields {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  /* одиночное числовое поле (integer / signed-integer) */
  #answer-input {
    width: 165px;
    font-family: inherit;
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    padding: 10px 14px;
    border-radius: 14px;
    border: 2px solid #cbd5e1;
    outline: none;
    color: var(--ink);
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  #answer-input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.18); }
  #answer-input:disabled { background: #f1f5f9; color: #94a3b8; }

  /* кнопка переключения знака (±) */
  .sign-toggle {
    width: 58px;
    height: 58px;
    padding: 0;
    border-radius: 14px;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    color: #64748b;
    font-family: inherit;
    font-size: 30px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: background .2s, color .2s, border-color .2s, box-shadow .2s, transform .12s;
  }
  .sign-toggle:hover:not(:disabled) { border-color: #94a3b8; }
  .sign-toggle:active:not(:disabled) { transform: scale(.96); }
  .sign-toggle.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 4px rgba(79,70,229,.18);
  }
  .sign-toggle:disabled { opacity: .5; cursor: default; }

  /* дробное поле ввода: числитель / черта / знаменатель */
  .fraction-input {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .fraction-part {
    width: 96px;
    font-family: inherit;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    padding: 6px 10px;
    border-radius: 10px;
    border: 2px solid #cbd5e1;
    outline: none;
    color: var(--ink);
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .fraction-part:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
  .fraction-part:disabled { background: #f1f5f9; color: #94a3b8; }

  .fraction-bar {
    width: 96px;
    height: 3px;
    background: var(--ink);
    border-radius: 2px;
  }

  .feedback {
    min-height: 34px;
    margin-top: 20px;
    font-size: 21px;
    font-weight: 700;
  }
  .feedback.ok  { color: var(--green); }
  .feedback.bad { color: var(--red); }

  .hint {
    margin-top: 18px;
    min-height: 20px;
    font-size: 15px;
    font-style: italic;
    font-weight: 500;
    color: #64748b;
    opacity: .65;
    user-select: none;
    transition: opacity .2s ease;
  }
  .card.correct .hint,
  .card.wrong   .hint { opacity: .25; }
  #btn-got-it {
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 12px 26px -12px var(--accent);
  }

  /* ---------- всплывающие значки ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
  }
  .overlay.show { animation: overlayPop .9s ease; }
  .overlay-icon {
    font-size: clamp(120px, 30vw, 200px);
    font-weight: 900;
    line-height: 1;
  }
  .overlay-icon.ok  { color: var(--green); text-shadow: 0 16px 50px rgba(22,163,74,.55); }
  .overlay-icon.bad { color: var(--red);   text-shadow: 0 16px 50px rgba(220,38,38,.55); }

  @keyframes overlayPop {
    0%   { opacity: 0; transform: scale(.4); }
    22%  { opacity: 1; transform: scale(1.12); }
    55%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.25); }
  }

  /* ---------- баннер между этапами ---------- */
  .banner {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.9);
    background: var(--accent);
    color: #fff;
    padding: 22px 30px;
    border-radius: 20px;
    font-size: clamp(17px, 4vw, 23px);
    font-weight: 800;
    text-align: center;
    max-width: 90vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 60;
    box-shadow: 0 24px 60px -22px rgba(79,70,229,.95);
  }
  .banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---------- экран результатов ---------- */
  .result-card {
    background: #fff;
    border-radius: 26px;
    padding: 34px 26px 30px;
    box-shadow: 0 22px 50px -24px rgba(30,41,59,.45);
  }
  .results {
    margin: 22px 0 28px;
    max-height: 52vh;
    overflow-y: auto;
    padding-right: 4px;
  }
  .results h2 {
    font-size: 13px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #94a3b8;
    margin: 18px 0 10px;
  }
  .results h2:first-child { margin-top: 0; }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }
  .result-item {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 19px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    border: 2px solid #e2e8f0;
    background: #f8fafc;
    color: #0f172a;
  }
  .result-item.ok {
    color: var(--green);
    border-color: #bbf7d0;
    background: #f0fdf4;
  }
  .result-item.bad {
    color: #000000;
    border-color: #cbd5e1;
    background: #f1f5f9;
  }
  .result-item .note {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: #94a3b8;
    margin-top: 3px;
  }
  .center { text-align: center; }

    /* ---------- кнопки-варианты (для виджета choice) ---------- */
  .choice-btn {
    min-width: 72px;
    height: 72px;
    padding: 0 18px;
    border-radius: 14px;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    color: var(--ink);
    font-family: inherit;
    font-size: 30px;
    font-weight: 800;
    cursor: pointer;
    transition: background .2s, color .2s, border-color .2s, box-shadow .2s, transform .12s;
  }
  .choice-btn:hover:not(:disabled) { border-color: #94a3b8; }
  .choice-btn:active:not(:disabled) { transform: scale(.96); }
  .choice-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 4px rgba(79,70,229,.18);
  }
  .choice-btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<!-- ============ ЭКРАН 1: СТАРТ ============ -->
<section id="screen-start" class="screen active">
  <div class="start-card">
    <h1>Тренажёр счёта</h1>
    <p class="subtitle">Умножение и деление целых чисел</p>
    <ul class="rules">
      <li>✖️ <b>12</b> верно решённых примеров на умножение</li>
      <li>➗ <b>12</b> верно решённых примеров на деление</li>
      <li>🎯 Ошибочный пример вернётся к тебе позже</li>
    </ul>
    <button class="btn primary" id="btn-start">Начать</button>
  </div>
</section>

<!-- ============ ЭКРАН 2: ЗАДАНИЕ ============ -->
<section id="screen-task" class="screen">
  <div class="topbar">
    <div class="phase" id="phase-label">Умножение</div>
    <div id="progress-label">Решено: 0 / 12</div>
  </div>
  <div class="progressbar"><div class="progressbar-fill" id="progress-fill"></div></div>

  <div class="card" id="task-card">
    <div class="example" id="example">7 × 8</div>
    <div class="answer-row">
      <!-- Поля ответа строит app.js в зависимости от phase.inputMode -->
      <div class="answer-fields" id="answer-fields"></div>
      <button class="btn primary" id="btn-check">Проверить</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="hint" id="hint"></div> 
    <button class="btn" id="btn-got-it" hidden>Понял</button>
  </div>
</section>

<!-- ============ ЭКРАН 3: РЕЗУЛЬТАТЫ ============ -->
<section id="screen-result" class="screen">
  <div class="result-card">
    <div class="center">
      <h1>Готово! 🎉</h1>
      <p class="subtitle" id="result-summary"></p>
    </div>
    <div class="results" id="results"></div>
    <div class="center">
      <button class="btn primary" id="btn-restart">Ещё раз</button>
    </div>
  </div>
</section>

<!-- вспомогательные слои -->
<div class="overlay" id="overlay"><div class="overlay-icon" id="overlay-icon"></div></div>
<div class="banner" id="banner"></div>

<script src="generators/classic.js"></script>
<script src="generators/signed.js"></script>
<script src="generators/comparison.js"></script>
<script src="app.js"></script>
</body>
</html>
