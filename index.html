<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр по предметам</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="screen-start" class="screen active">
  <div class="start-card">
    <h1>Тренажёр по предметам</h1>
    <p class="subtitle" id="start-subtitle">Загрузка…</p>
    <ul class="rules" id="start-rules"></ul>
    <button class="btn primary" id="btn-start">Начать</button>
  </div>
</section>

<section id="screen-task" class="screen">
  <div class="topbar">
    <div class="phase" id="phase-label">Умножение</div>
    <div id="progress-label">Решено: 0 / 12</div>
  </div>
  <div class="progressbar"><div class="progressbar-fill" id="progress-fill"></div></div>
  <div class="card" id="task-card">
    <div class="top-panel" id="top-panel"></div>
    <div class="answer-row">
      <div class="bottom-panel" id="bottom-panel"></div>
      <button class="btn primary" id="btn-check">Проверить</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn" id="btn-got-it" hidden>Понял</button>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="result-card">
    <div class="center">
      <h1>Готово! 🎉</h1>
      <p class="subtitle" id="result-summary"></p>
    </div>
    <div class="results" id="results"></div>
    <div class="center">
      <button class="btn primary" id="btn-restart">Ещё раз</button>
    </div>
  </div>
</section>

<div class="overlay" id="overlay"><div class="overlay-icon" id="overlay-icon"></div></div>
<div class="banner" id="banner"></div>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="generators/classic.js"></script>
<script src="generators/test.js"></script>
<script src="generators/signed.js"></script>
<script src="app.js"></script>
</body>
</html>
